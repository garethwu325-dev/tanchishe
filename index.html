<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇 Snake</title>
  <style>
    /* === 全局重置与布局 === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
    }
    .game-container {
      background: #16213e;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: #e0e0e0;
    }
    .game-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #0f3460;
      letter-spacing: 2px;
    }
    .score-board {
      font-size: 18px;
      background: #0f3460;
      padding: 6px 18px;
      border-radius: 8px;
      color: #e94560;
      font-weight: bold;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      border: 2px solid #0f3460;
      border-radius: 8px;
      background: #0a0a23;
      /* 尺寸由 JS 设置 */
    }
    .game-footer {
      margin-top: 16px;
      color: #a0a0c0;
      font-size: 14px;
    }
    #restartBtn {
      background: #e94560;
      border: none;
      color: white;
      font-size: 16px;
      padding: 8px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      margin-top: 8px;
    }
    #restartBtn:hover {
      background: #c73650;
    }
    .game-over-msg {
      color: #e94560;
      font-size: 18px;
      font-weight: bold;
      margin-top: 8px;
      min-height: 28px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="game-header">
      <h1>🐍 贪吃蛇</h1>
      <div class="score-board">得分: <span id="scoreDisplay">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="game-footer">
      <div class="game-over-msg" id="gameOverMsg"></div>
      <button id="restartBtn">重新开始</button>
      <p style="margin-top: 8px;">方向键 ↑↓←→ 控制移动</p>
    </div>
  </div>
<script>
  // ===== 游戏常量 =====
  const GRID_SIZE = 20;       // 20×20 网格
  const CELL_SIZE = 20;       // 每格 20px
  const CANVAS_SIZE = 400;    // 400×400 px
  const INIT_SNAKE_LENGTH = 3;
  const MOVE_INTERVAL = 150;  // 移动间隔（ms）

  // ===== DOM 引用 =====
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const gameOverMsg = document.getElementById('gameOverMsg');

  // ===== 游戏状态 =====
  let snake = [];          // 蛇身坐标数组 [{x, y}, ...]
  let food = { x: 0, y: 0 };
  let direction = 'RIGHT'; // 当前移动方向
  let nextDirection = 'RIGHT';
  let score = 0;
  let gameRunning = false;
  let gameLoopId = null;

  // ===== 方向向量映射 =====
  const DIR_VECTORS = {
    'UP':    { x: 0, y: -1 },
    'DOWN':  { x: 0, y: 1 },
    'LEFT':  { x: -1, y: 0 },
    'RIGHT': { x: 1, y: 0 }
  };

  // ===== 反向检测 =====
  const OPPOSITE = {
    'UP': 'DOWN',
    'DOWN': 'UP',
    'LEFT': 'RIGHT',
    'RIGHT': 'LEFT'
  };

  /**
   * 初始化游戏状态
   */
  function initGame() {
    // 蛇：水平朝右，头部在中间
    const startX = Math.floor(GRID_SIZE / 2);
    const startY = Math.floor(GRID_SIZE / 2);
    snake = [];
    for (let i = 0; i < INIT_SNAKE_LENGTH; i++) {
      snake.push({ x: startX - i, y: startY });
    }

    direction = 'RIGHT';
    nextDirection = 'RIGHT';
    score = 0;
    gameRunning = true;
    gameOverMsg.textContent = '';
    updateScore();
    spawnFood();
  }

  /**
   * 随机生成食物（不与蛇身重叠）
   */
  function spawnFood() {
    const totalCells = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      for (let y = 0; y < GRID_SIZE; y++) {
        totalCells.push({ x, y });
      }
    }
    // 过滤掉蛇身占用的格子
    const snakeSet = new Set(snake.map(c => `${c.x},${c.y}`));
    const available = totalCells.filter(c => !snakeSet.has(`${c.x},${c.y}`));

    if (available.length === 0) {
      // 蛇占满屏幕 → 胜利
      gameOver('🎉 你赢了！');
      return;
    }
    const idx = Math.floor(Math.random() * available.length);
    food = available[idx];
  }

  /**
   * 更新得分显示
   */
  function updateScore() {
    scoreDisplay.textContent = score;
  }

  /**
   * 推进游戏状态一步
   * 返回: true=继续, false=游戏结束
   */
  function update() {
    // 应用已缓存的有效方向
    direction = nextDirection;
    const vec = DIR_VECTORS[direction];
    if (!vec) return false;

    // 计算新蛇头
    const head = snake[0];
    const newHead = {
      x: head.x + vec.x,
      y: head.y + vec.y
    };

    // 碰撞检测：撞墙
    if (newHead.x < 0 || newHead.x >= GRID_SIZE ||
        newHead.y < 0 || newHead.y >= GRID_SIZE) {
      gameOver('💥 撞到墙了！');
      return false;
    }

    // 碰撞检测：撞自身（跳过尾部——尾部即将移除，除非吃到食物）
    const willEat = (newHead.x === food.x && newHead.y === food.y);
    const bodyToCheck = willEat ? snake : snake.slice(0, -1);
    for (const seg of bodyToCheck) {
      if (seg.x === newHead.x && seg.y === newHead.y) {
        gameOver('💥 撞到自己了！');
        return false;
      }
    }

    // 移动蛇：头部插入
    snake.unshift(newHead);

    if (willEat) {
      // 吃到食物：保留尾部（长度+1）
      score += 10;
      updateScore();
      spawnFood();
      // 如果食物生成时检测到胜利，spawnFood 已经调用 gameOver
      if (!gameRunning) return false;
    } else {
      // 未吃到：移除尾部
      snake.pop();
    }

    return true;
  }

  /**
   * 绘制画布
   */
  function render() {
    // 清空
    ctx.fillStyle = '#0a0a23';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    // === 绘制网格线（淡） ===
    ctx.strokeStyle = '#1a1a3e';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_SIZE, 0);
      ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_SIZE);
      ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
      ctx.stroke();
    }

    // === 绘制食物 ===
    ctx.fillStyle = '#e94560';
    ctx.shadowColor = '#e94560';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
    const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
    ctx.arc(fx, fy, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // === 绘制蛇身 ===
    for (let i = 0; i < snake.length; i++) {
      const seg = snake[i];
      const px = seg.x * CELL_SIZE;
      const py = seg.y * CELL_SIZE;
      const padding = 1;

      if (i === 0) {
        // 蛇头
        ctx.fillStyle = '#00d2ff';
        ctx.shadowColor = '#00d2ff';
        ctx.shadowBlur = 10;
      } else {
        // 蛇身：从亮绿渐变到深绿
        const t = i / snake.length;
        const r = Math.round(0 + t * 0);
        const g = Math.round(210 - t * 120);
        const b = Math.round(80 - t * 40);
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#00a86b';
      }

      ctx.fillRect(px + padding, py + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2);

      // 蛇头眼睛
      if (i === 0) {
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        const eyeSize = 3;
        let ex1, ey1, ex2, ey2;
        const cx = px + CELL_SIZE / 2;
        const cy = py + CELL_SIZE / 2;
        switch (direction) {
          case 'UP':
            ex1 = cx - 4; ey1 = cy - 3; ex2 = cx + 4; ey2 = cy - 3; break;
          case 'DOWN':
            ex1 = cx - 4; ey1 = cy + 3; ex2 = cx + 4; ey2 = cy + 3; break;
          case 'LEFT':
            ex1 = cx - 3; ey1 = cy - 4; ex2 = cx - 3; ey2 = cy + 4; break;
          case 'RIGHT':
            ex1 = cx + 3; ey1 = cy - 4; ex2 = cx + 3; ey2 = cy + 4; break;
          default:
            ex1 = cx + 3; ey1 = cy - 4; ex2 = cx + 3; ey2 = cy + 4;
        }
        ctx.beginPath();
        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.shadowBlur = 0;

    // 如果游戏结束，覆盖半透明遮罩
    if (!gameRunning) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    }
  }

  /**
   * 游戏循环（由 setInterval 驱动）
   */
  function gameLoop() {
    if (!gameRunning) return;
    if (!update()) {
      // update 返回 false 表示游戏结束，停止循环
      stopGame();
      render();
      return;
    }
    render();
  }

  /**
   * 启动游戏循环
   */
  function startGame() {
    if (gameLoopId !== null) {
      clearInterval(gameLoopId);
    }
    gameLoopId = setInterval(gameLoop, MOVE_INTERVAL);
  }

  /**
   * 停止游戏循环
   */
  function stopGame() {
    gameRunning = false;
    if (gameLoopId !== null) {
      clearInterval(gameLoopId);
      gameLoopId = null;
    }
  }

  /**
   * 游戏结束处理
   * @param {string} message - 显示的消息
   */
  function gameOver(message) {
    gameRunning = false;
    gameOverMsg.textContent = message;
  }

  /**
   * 键盘事件处理
   */
  function handleKeyDown(e) {
    if (!gameRunning) return;
    const keyMap = {
      'ArrowUp': 'UP',
      'ArrowDown': 'DOWN',
      'ArrowLeft': 'LEFT',
      'ArrowRight': 'RIGHT'
    };
    const newDir = keyMap[e.key];
    if (!newDir) return;
    e.preventDefault(); // 阻止页面滚动

    // 禁止反向
    if (OPPOSITE[newDir] === direction) return;
    nextDirection = newDir;
  }

  /**
   * 重新开始游戏
   */
  function restartGame() {
    stopGame();
    initGame();
    render();
    startGame();
  }

  // ===== 事件注册 =====
  document.addEventListener('keydown', handleKeyDown);
  document.getElementById('restartBtn').addEventListener('click', restartGame);

  // ===== 启动游戏 =====
  initGame();
  render();
  startGame();
</script>
</body>
</html>
